<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>每日快樂水</title>
    <!-- 使用最穩定的資源下載點 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); }
        body { -webkit-tap-highlight-color: transparent; font-family: sans-serif; transition: background-color 0.5s; margin: 0; }
        .today-highlight { background: rgba(255, 255, 255, 0.6) !important; box-shadow: inset 0 0 0 2px rgba(138, 122, 130, 0.4) !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; color:#8a7a82;">
            <p style="font-size: 30px;">🧋</p>
            <p>快樂水日記載入中...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const sugarLevels = ["全糖", "少糖", "半糖", "微糖", "二分", "一分", "無糖", "固定"];
        const iceLevels = ["正常", "少冰", "微冰", "去冰", "常溫", "溫", "熱", "固定"];
        const themes = [
            { bg: '#f5f0f2', pri: '#b4a7af', name: '藕粉紫' },
            { bg: '#edf2f0', pri: '#99a8a1', name: '薄荷綠' },
            { bg: '#f2f3f5', pri: '#a0aab8', name: '霧霾藍' },
            { bg: '#f7f3ee', pri: '#c2b3a3', name: '暖沙色' },
            { bg: '#f2f1f7', pri: '#a8a5bd', name: '薰衣草' }
        ];

        function App() {
            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('user_gas_url') || '');
            const [drinkData, setDrinkData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('myDrinkLogs_v11') || '{}'); } catch(e) { return {}; }
            });
            const [currentTheme, setCurrentTheme] = useState(themes[0]);
            
            const now = new Date();
            const [curYear, setCurYear] = useState(now.getFullYear());
            const [curMonth, setCurMonth] = useState(now.getMonth()); 
            const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingOpen, setIsSettingOpen] = useState(false);
            const [activeDateKey, setActiveDateKey] = useState("");
            const [isSaving, setIsSaving] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [editData, setEditData] = useState({
                cup1: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false },
                cup2: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false }
            });

            useEffect(() => { localStorage.setItem('myDrinkLogs_v11', JSON.stringify(drinkData)); }, [drinkData]);
            useEffect(() => { localStorage.setItem('user_gas_url', gasUrl); }, [gasUrl]);

            // 年度與月度統計功能回歸
            const stats = useMemo(() => {
                let mCups = 0, mCost = 0, yCups = 0, yCost = 0;
                Object.keys(drinkData).forEach(key => {
                    const isThisYear = key.startsWith(`${curYear}-`);
                    const isThisMonth = key.startsWith(`${curYear}-${String(curMonth + 1).padStart(2, '0')}`);
                    const day = drinkData[key];
                    if (day) {
                        [day.cup1, day.cup2].forEach(cup => {
                            if (cup?.item) {
                                const p = parseInt(cup.price) || 0;
                                if (isThisYear) { yCups++; yCost += p; }
                                if (isThisMonth) { mCups++; mCost += p; }
                            }
                        });
                    }
                });
                return { mCups, mCost, yCups, yCost };
            }, [drinkData, curYear, curMonth]);

            const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(curYear, curMonth, 1).getDay();

            const handleSave = async () => {
                setIsSaving(true);
                try {
                    if (gasUrl) {
                        await fetch(gasUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ date: activeDateKey, cup1: editData.cup1, cup2: editData.cup2 }) });
                    }
                    setDrinkData(prev => ({ ...prev, [activeDateKey]: editData }));
                    setIsModalOpen(false);
                } catch (e) { alert('同步失敗，但已存於手機'); }
                finally { setIsSaving(false); }
            };

            const pullFromCloud = async () => {
                if (!gasUrl) return alert("請先設定網址");
                setIsSyncing(true);
                try {
                    const res = await fetch(gasUrl);
                    const data = await res.json();
                    setDrinkData(data);
                    alert("同步成功！");
                } catch (e) { alert("讀取失敗"); }
                finally { setIsSyncing(false); }
            };

            return (
                <div className="min-h-screen p-5 pb-10" style={{ backgroundColor: currentTheme.bg }}>
                    <div className="max-w-md mx-auto relative">
                        <button onClick={() => setIsSettingOpen(true)} className="absolute right-0 top-4 opacity-30 p-2 text-xl">⚙️</button>

                        <header className="text-center mb-6 pt-4">
                            <h1 className="text-3xl font-black text-[#8a7a82] tracking-widest">每日快樂水</h1>
                            <p className="text-[10px] opacity-50 font-bold uppercase tracking-[0.3em]">Sweetness Diary {curYear}</p>
                        </header>

                        {/* 四個統計框回歸 */}
                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <StatBox title="當月杯數" value={stats.mCups} color={currentTheme.pri} />
                            <StatBox title="當月花費" value={`$${stats.mCost}`} color="#d4b2b7" />
                            <StatBox title="年度累積" value={stats.yCups} color={currentTheme.pri} opacity="80" />
                            <StatBox title="年度花費" value={`$${stats.yCost}`} color="#d4b2b7" opacity="80" />
                        </div>

                        <div className="glass-card rounded-[35px] p-6 shadow-sm">
                            <div className="flex justify-between items-center mb-8">
                                <button onClick={() => curMonth === 0 ? (setCurYear(y => y - 1), setCurMonth(11)) : setCurMonth(m => m - 1)} className="w-10 h-10">⇠</button>
                                <h2 className="text-xl font-bold">{curYear}年 {curMonth + 1}月</h2>
                                <button onClick={() => curMonth === 11 ? (setCurYear(y => y + 1), setCurMonth(0)) : setCurMonth(m => m + 1)} className="w-10 h-10">⇢</button>
                            </div>

                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={`e-${i}`} />)}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const d = i + 1;
                                    const key = `${curYear}-${String(curMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                    const isToday = key === todayKey;
                                    return (
                                        <div key={d} onClick={() => {
                                            setActiveDateKey(key);
                                            setEditData(drinkData[key] || { cup1: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false }, cup2: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false } });
                                            setIsModalOpen(true);
                                        }} className={`aspect-square flex flex-col items-center justify-center relative rounded-2xl active:bg-white/50 transition-all ${isToday ? 'today-highlight' : ''}`}>
                                            <span className={`text-[11px] font-bold absolute top-1.5 left-2 ${isToday ? 'text-[#8a7a82]' : 'text-slate-300'}`}>{d}</span>
                                            {drinkData[key] && <span className="text-xl mt-2">🧋</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 背景更換按鈕回歸 */}
                        <div className="mt-8 flex justify-center gap-4">
                            {themes.map(t => (
                                <div key={t.name} onClick={() => setCurrentTheme(t)} className="w-7 h-7 rounded-full border-2 border-white shadow-sm cursor-pointer" style={{ backgroundColor: t.bg }} />
                            ))}
                        </div>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/20 backdrop-blur-sm text-[#5e5459]">
                            <div className="bg-white w-full max-w-sm rounded-t-[40px] sm:rounded-[40px] p-6 shadow-2xl flex flex-col max-h-[90dvh]">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">{activeDateKey.replace(/-/g, ' / ')}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-3xl">&times;</button>
                                </div>
                                <div className="space-y-6 overflow-y-auto pr-1 pb-4 custom-scrollbar">
                                    {[1, 2].map(n => (
                                        <div key={n} className="p-5 bg-[#faf9fa] rounded-[30px] border border-[#f0ebf0] space-y-4">
                                            <span className="text-[10px] font-bold opacity-50 tracking-widest">CUP 0{n}</span>
                                            <input placeholder="店名" value={editData[`cup${n}`].shop} onChange={e => setEditData({...editData, [`cup${n}`]: {...editData[`cup${n}`], shop: e.target.value}})} className="w-full p-3 rounded-xl bg-white shadow-sm" />
                                            <input placeholder="品項" value={editData[`cup${n}`].item} onChange={e => setEditData({...editData, [`cup${n}`]: {...editData[`cup${n}`], item: e.target.value}})} className="w-full p-3 rounded-xl bg-white shadow-sm" />
                                            <div className="flex items-center space-x-3">
                                                <input type="number" placeholder="價格" value={editData[`cup${n}`].price} onChange={e => setEditData({...editData, [`cup${n}`]: {...editData[`cup${n}`], price: e.target.value}})} className="flex-1 p-3 rounded-xl bg-white shadow-sm" />
                                                <label className="flex items-center space-x-1 text-sm font-bold">
                                                    <input type="checkbox" checked={editData[`cup${n}`].isFree} onChange={e => setEditData({...editData, [`cup${n}`]: {...editData[`cup${n}`], isFree: e.target.checked}})} />
                                                    <span>免費</span>
                                                </label>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={handleSave} disabled={isSaving} className="w-full mt-4 bg-[#8a7a82] text-white py-4 rounded-3xl font-bold">
                                    {isSaving ? '正在同步...' : '儲存紀錄'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Settings */}
                    {isSettingOpen && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
                            <div className="bg-white w-full max-w-xs rounded-[35px] p-8 text-center">
                                <h3 className="font-bold mb-4">設定</h3>
                                <textarea className="w-full p-4 bg-gray-50 rounded-2xl text-[10px] h-32 mb-4 border-none" placeholder="貼上 GAS 網址" value={gasUrl} onChange={e => setGasUrl(e.target.value)} />
                                <button onClick={pullFromCloud} disabled={isSyncing} className="w-full bg-[#a0aab8] text-white py-4 rounded-2xl font-bold mb-4">
                                    {isSyncing ? '同步中...' : '🔄 從雲端載入數據'}
                                </button>
                                <button onClick={() => setIsSettingOpen(false)} className="w-full bg-gray-100 text-gray-400 py-3 rounded-2xl font-bold">關閉</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StatBox({ title, value, color, opacity = "100" }) {
            return (
                <div className="bg-white rounded-[25px] p-4 shadow-sm border-l-[6px]" style={{ borderColor: color, opacity: opacity/100 }}>
                    <p className="text-[11px] font-bold text-slate-400 mb-1">{title}</p>
                    <p className="text-2xl font-black text-slate-700">{value}</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
