<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>每日快樂水</title>
    
    <!-- 更換更穩定的資源下載點 (cdn.jsdelivr.net) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); }
        body { background-color: #f5f0f2; margin: 0; font-family: sans-serif; }
        .today-highlight { background: rgba(255, 255, 255, 0.5) !important; box-shadow: inset 0 0 0 2px rgba(138, 122, 130, 0.5) !important; }
    </style>
</head>
<body>
    <div id="root">
        <!-- 啟動介面：若長久未消失，下方有重設按鈕 -->
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; color:#8a7a82; text-align:center; padding:20px;">
            <p style="font-size: 30px;">🧋</p>
            <p>快樂水系統啟動中...</p>
            <p style="font-size: 12px; opacity: 0.5; margin-top: 20px;">如果畫面停留超過 10 秒</p>
            <button onclick="localStorage.clear(); location.reload();" style="margin-top:10px; padding:8px 16px; background:#b4a7af; color:white; border:none; border-radius:10px; font-size:12px;">點此清除暫存並重試</button>
        </div>
    </div>

    <script type="text/babel">
        // 增加全域錯誤攔截，如果出錯會直接彈出視窗告訴我們原因
        window.onerror = function(msg, url, line) {
            alert("系統錯誤: " + msg + "\n行號: " + line);
        };

        const { useState, useEffect, useMemo } = React;

        function App() {
            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('user_gas_url') || '');
            const [drinkData, setDrinkData] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('myDrinkLogs_v11') || '{}');
                } catch(e) { return {}; }
            });
            
            const now = new Date();
            const [curYear, setCurYear] = useState(now.getFullYear());
            const [curMonth, setCurMonth] = useState(now.getMonth()); 
            const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingOpen, setIsSettingOpen] = useState(false);
            const [activeDateKey, setActiveDateKey] = useState("");
            const [isSaving, setIsSaving] = useState(false);
            const [editData, setEditData] = useState({
                cup1: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false },
                cup2: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false }
            });

            useEffect(() => { localStorage.setItem('myDrinkLogs_v11', JSON.stringify(drinkData)); }, [drinkData]);
            useEffect(() => { localStorage.setItem('user_gas_url', gasUrl); }, [gasUrl]);

            const stats = useMemo(() => {
                let mCups = 0, mCost = 0;
                try {
                    Object.keys(drinkData).forEach(key => {
                        const isThisMonth = key.startsWith(`${curYear}-${String(curMonth + 1).padStart(2, '0')}`);
                        if (isThisMonth && drinkData[key]) {
                            const day = drinkData[key];
                            if (day.cup1?.item) { mCups++; mCost += (parseInt(day.cup1.price) || 0); }
                            if (day.cup2?.item) { mCups++; mCost += (parseInt(day.cup2.price) || 0); }
                        }
                    });
                } catch(e) {}
                return { mCups, mCost };
            }, [drinkData, curYear, curMonth]);

            const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(curYear, curMonth, 1).getDay();

            return (
                <div className="min-h-screen p-5 pb-10" style={{ backgroundColor: '#f5f0f2', color: '#5e5459' }}>
                    <div className="max-w-md mx-auto relative">
                        <button onClick={() => setIsSettingOpen(true)} className="absolute right-0 top-4 opacity-30 p-2 text-xl">⚙️</button>
                        <header className="text-center mb-6 pt-4">
                            <h1 className="text-3xl font-black text-[#8a7a82]">每日快樂水</h1>
                            <p className="text-[10px] opacity-50 font-bold uppercase tracking-widest">Diary {curYear}</p>
                        </header>

                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <div className="bg-white rounded-3xl p-4 shadow-sm border-l-4 border-[#b4a7af]">
                                <p className="text-[10px] text-slate-400 font-bold">當月杯數</p>
                                <p className="text-2xl font-black">{stats.mCups}</p>
                            </div>
                            <div className="bg-white rounded-3xl p-4 shadow-sm border-l-4 border-[#d4b2b7]">
                                <p className="text-[10px] text-slate-400 font-bold">當月花費</p>
                                <p className="text-2xl font-black">${stats.mCost}</p>
                            </div>
                        </div>

                        <div className="glass-card rounded-[35px] p-6 shadow-sm">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={() => curMonth === 0 ? (setCurYear(y=>y-1), setCurMonth(11)) : setCurMonth(m=>m-1)} className="p-2">⇠</button>
                                <h2 className="text-lg font-bold">{curYear}年 {curMonth + 1}月</h2>
                                <button onClick={() => curMonth === 11 ? (setCurYear(y=>y+1), setCurMonth(0)) : setCurMonth(m=>m+1)} className="p-2">⇢</button>
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={i} />)}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const d = i + 1;
                                    const key = `${curYear}-${String(curMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                    const hasData = drinkData[key] && (drinkData[key].cup1?.item || drinkData[key].cup2?.item);
                                    return (
                                        <div key={d} onClick={() => {
                                            setActiveDateKey(key);
                                            setEditData(drinkData[key] || { cup1:{}, cup2:{} });
                                            setIsModalOpen(true);
                                        }} className={`aspect-square flex items-center justify-center relative rounded-xl ${key === todayKey ? 'today-highlight' : ''}`}>
                                            <span className="text-[10px] absolute top-1 left-1 opacity-40">{d}</span>
                                            {hasData && <span className="text-xl">🧋</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* 設定視窗 */}
                    {isSettingOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/50 backdrop-blur-md">
                            <div className="bg-white w-full max-w-xs rounded-[30px] p-8 text-center shadow-xl">
                                <h3 className="font-bold mb-4">設定</h3>
                                <textarea className="w-full p-4 bg-gray-50 rounded-xl text-[10px] h-32 mb-4" placeholder="貼上 Google 網址" value={gasUrl} onChange={e => setGasUrl(e.target.value)} />
                                <button onClick={() => setIsSettingOpen(false)} className="w-full bg-[#b4a7af] text-white py-3 rounded-xl font-bold">關閉</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
