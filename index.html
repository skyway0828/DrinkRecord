<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>每日快樂水</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); }
        body { background-color: #f5f0f2; margin: 0; font-family: sans-serif; }
        .today-highlight { background: rgba(255, 255, 255, 0.5) !important; box-shadow: inset 0 0 0 2px rgba(138, 122, 130, 0.5) !important; }
    </style>
</head>
<body>
    <!-- 如果 GitHub 正常，你會先看到下面這行字 -->
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#8a7a82;">
            <p>☕ 快樂水系統載入中... (若長久未消失請檢查網路)</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // 這裡放原本的所有程式碼
            const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('user_gas_url') || '');
            const [drinkData, setDrinkData] = useState(() => {
                try { return JSON.parse(localStorage.getItem('myDrinkLogs_v11') || '{}'); } catch(e) { return {}; }
            });
            
            const now = new Date();
            const [curYear, setCurYear] = useState(now.getFullYear());
            const [curMonth, setCurMonth] = useState(now.getMonth()); 
            const todayKey = now.toLocaleDateString('en-CA'); 

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingOpen, setIsSettingOpen] = useState(false);
            const [activeDateKey, setActiveDateKey] = useState("");
            const [currentTheme, setCurrentTheme] = useState({ bg: '#f5f0f2', pri: '#b4a7af' });
            const [isSaving, setIsSaving] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [editData, setEditData] = useState({
                cup1: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false },
                cup2: { shop: '', item: '', sugar: '', ice: '', price: '', isFree: false }
            });

            useEffect(() => { localStorage.setItem('myDrinkLogs_v11', JSON.stringify(drinkData)); }, [drinkData]);
            useEffect(() => { localStorage.setItem('user_gas_url', gasUrl); }, [gasUrl]);

            const stats = useMemo(() => {
                let mCups = 0, mCost = 0, yCups = 0, yCost = 0;
                Object.keys(drinkData).forEach(key => {
                    const isThisYear = key.startsWith(`${curYear}-`);
                    const isThisMonth = key.startsWith(`${curYear}-${String(curMonth + 1).padStart(2, '0')}`);
                    const day = drinkData[key];
                    if (day && day.cup1) {
                        [day.cup1, day.cup2].forEach(cup => {
                            if (cup?.item) {
                                const p = parseInt(cup.price) || 0;
                                if (isThisYear) { yCups++; yCost += p; }
                                if (isThisMonth) { mCups++; mCost += p; }
                            }
                        });
                    }
                });
                return { mCups, mCost, yCups, yCost };
            }, [drinkData, curYear, curMonth]);

            const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
            const firstDayOfMonth = new Date(curYear, curMonth, 1).getDay();

            return (
                <div className="min-h-screen p-5 pb-10" style={{ backgroundColor: currentTheme.bg, color: '#5e5459' }}>
                    <div className="max-w-md mx-auto relative">
                        <button onClick={() => setIsSettingOpen(true)} className="absolute right-0 top-4 opacity-30 p-2">⚙️</button>
                        <header className="text-center mb-6 pt-4">
                            <h1 className="text-3xl font-black tracking-widest text-[#8a7a82]">每日快樂水</h1>
                            <p className="text-[10px] uppercase mt-1 opacity-50 font-bold">DIARY {curYear}</p>
                        </header>

                        <div className="grid grid-cols-2 gap-3 mb-6 text-center">
                            <div className="bg-white p-4 rounded-3xl shadow-sm border-l-4 border-[#b4a7af]">
                                <p className="text-[10px] text-gray-400">當月杯數</p>
                                <p className="text-xl font-bold">{stats.mCups}</p>
                            </div>
                            <div className="bg-white p-4 rounded-3xl shadow-sm border-l-4 border-[#d4b2b7]">
                                <p className="text-[10px] text-gray-400">當月花費</p>
                                <p className="text-xl font-bold">${stats.mCost}</p>
                            </div>
                        </div>

                        <div className="glass-card rounded-[35px] p-6">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={() => curMonth === 0 ? (setCurYear(y=>y-1), setCurMonth(11)) : setCurMonth(m=>m-1)}>⇠</button>
                                <h2 className="font-bold">{curYear}年 {curMonth + 1}月</h2>
                                <button onClick={() => curMonth === 11 ? (setCurYear(y=>y+1), setCurMonth(0)) : setCurMonth(m=>m+1)}>⇢</button>
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                                {Array.from({ length: firstDayOfMonth }).map((_, i) => <div key={i} />)}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const d = i + 1;
                                    const key = `${curYear}-${String(curMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                    return (
                                        <div key={d} onClick={() => {
                                            setActiveDateKey(key);
                                            setEditData(drinkData[key] || { cup1: { item: '' }, cup2: { item: '' } });
                                            setIsModalOpen(true);
                                        }} className={`aspect-square flex flex-col items-center justify-center relative rounded-xl ${key === todayKey ? 'today-highlight' : ''}`}>
                                            <span className="text-[10px] absolute top-1 left-1">{d}</span>
                                            {drinkData[key] && <span>🧋</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
